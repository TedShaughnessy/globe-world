name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish one GitHub Release containing the Fabric mod and shader packs
        type: boolean
        default: false
      publish_mod_sources:
        description: Attach the Fabric mod sources jar to the GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: detect java version
        id: java
        shell: bash
        run: |
          set -euo pipefail

          java_version="$(
            awk -F= '
              $1 == "java_version" {
                value = $0
                sub(/^[^=]*=/, "", value)
                gsub(/\r$/, "", value)
                print value
                exit
              }
            ' gradle.properties
          )"
          if [[ -z "$java_version" ]]; then
            echo "::error::Missing java_version in gradle.properties"
            exit 1
          fi
          echo "version=$java_version" >> "$GITHUB_OUTPUT"

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'microsoft'

      - name: detect artifact versions
        id: versions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          base_ref=""
          if [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base_ref="$BEFORE_SHA"
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          fi

          property_from_text() {
            local key="$1"
            awk -F= -v key="$key" '
              $1 == key {
                value = $0
                sub(/^[^=]*=/, "", value)
                gsub(/\r$/, "", value)
                print value
                exit
              }
            '
          }

          current_property() {
            local key="$1"
            local value
            value="$(property_from_text "$key" < gradle.properties)"
            if [[ -z "$value" ]]; then
              echo "::error::Missing $key in gradle.properties"
              exit 1
            fi
            printf '%s' "$value"
          }

          previous_property() {
            local key="$1"
            local text
            if [[ -z "$base_ref" ]]; then
              return 0
            fi
            if text="$(git show "${base_ref}:gradle.properties" 2>/dev/null)"; then
              printf '%s\n' "$text" | property_from_text "$key"
            fi
          }

          emit_artifact_version() {
            local output_name="$1"
            local property_name="$2"
            local current
            local previous
            local changed=false

            current="$(current_property "$property_name")"
            previous="$(previous_property "$property_name")"
            if [[ "$EVENT_NAME" == "push" && ( "$current" != "$previous" || "$minecraft_changed" == "true" ) ]]; then
              changed=true
            fi

            {
              echo "${output_name}_version=$current"
              echo "${output_name}_changed=$changed"
            } >> "$GITHUB_OUTPUT"

            echo "${property_name}: ${previous:-<none>} -> ${current} (minecraft target changed: ${minecraft_changed}, artifact: ${changed})"
          }

          current_minecraft_version="$(current_property minecraft_version)"
          previous_minecraft_version="$(previous_property minecraft_version)"
          minecraft_changed=false
          if [[ "$EVENT_NAME" == "push" && "$current_minecraft_version" != "$previous_minecraft_version" ]]; then
            minecraft_changed=true
          fi

          echo "Comparing versions against ${base_ref:-<none>}."
          echo "minecraft_version=$current_minecraft_version" >> "$GITHUB_OUTPUT"
          emit_artifact_version mod mod_version
          emit_artifact_version globe_world_curvature_shaderpack globe_world_curvature_shaderpack_version
          emit_artifact_version makeup_ultra_fast_globe_world_shaderpack makeup_ultra_fast_globe_world_shaderpack_version

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        shell: bash
        run: |
          set -euo pipefail

          tasks=(build)
          if [[ "${{ steps.versions.outputs.globe_world_curvature_shaderpack_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}" == "true" ]]; then
            tasks+=(packageGlobeWorldCurvatureShaderpack)
          fi
          if [[ "${{ steps.versions.outputs.makeup_ultra_fast_globe_world_shaderpack_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}" == "true" ]]; then
            tasks+=(packageMakeupUltraFastGlobeWorldShaderpack)
          fi

          ./gradlew "${tasks[@]}"

      - name: upload mod artifact
        if: github.event_name == 'push' && steps.versions.outputs.mod_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: globe-world-fabric-mod-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.mod_version }}
          path: |
            mod-fabric/build/libs/globe-world-fabric-mod-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.mod_version }}.jar
            mod-fabric/build/libs/globe-world-fabric-mod-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.mod_version }}-sources.jar
          if-no-files-found: error

      - name: upload Globe World curvature shaderpack artifact
        if: github.event_name == 'push' && steps.versions.outputs.globe_world_curvature_shaderpack_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: globe-world-optional-curvature-shaderpack-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.globe_world_curvature_shaderpack_version }}
          path: build/distributions/shaderpacks/globe-world-optional-curvature-shaderpack-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.globe_world_curvature_shaderpack_version }}.zip
          if-no-files-found: error

      - name: upload MakeUp Ultra Fast Globe World shaderpack artifact
        if: github.event_name == 'push' && steps.versions.outputs.makeup_ultra_fast_globe_world_shaderpack_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: makeup-ultra-fast-globe-world-optional-curvature-shaderpack-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.makeup_ultra_fast_globe_world_shaderpack_version }}
          path: build/distributions/shaderpacks/makeup-ultra-fast-globe-world-optional-curvature-shaderpack-mc${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.makeup_ultra_fast_globe_world_shaderpack_version }}.zip
          if-no-files-found: error

      - name: publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          GLOBE_WORLD_CURVATURE_SHADERPACK_VERSION: ${{ steps.versions.outputs.globe_world_curvature_shaderpack_version }}
          MAKEUP_ULTRA_FAST_GLOBE_WORLD_SHADERPACK_VERSION: ${{ steps.versions.outputs.makeup_ultra_fast_globe_world_shaderpack_version }}
          MINECRAFT_VERSION: ${{ steps.versions.outputs.minecraft_version }}
          INCLUDE_MOD_SOURCES: ${{ inputs.publish_mod_sources }}
        run: |
          set -euo pipefail

          release_assets=(
            "mod-fabric/build/libs/globe-world-fabric-mod-mc${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
            "build/distributions/shaderpacks/globe-world-optional-curvature-shaderpack-mc${MINECRAFT_VERSION}-${GLOBE_WORLD_CURVATURE_SHADERPACK_VERSION}.zip"
            "build/distributions/shaderpacks/makeup-ultra-fast-globe-world-optional-curvature-shaderpack-mc${MINECRAFT_VERSION}-${MAKEUP_ULTRA_FAST_GLOBE_WORLD_SHADERPACK_VERSION}.zip"
          )
          if [[ "$INCLUDE_MOD_SOURCES" == "true" ]]; then
            release_assets+=(
              "mod-fabric/build/libs/globe-world-fabric-mod-mc${MINECRAFT_VERSION}-${MOD_VERSION}-sources.jar"
            )
          fi

          {
            echo "Globe World release targeting Minecraft ${MINECRAFT_VERSION}."
            echo
            echo "- Required Fabric mod: globe-world-fabric-mod-mc${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
            echo "- Optional Sodium/Iris curvature shader pack: globe-world-optional-curvature-shaderpack-mc${MINECRAFT_VERSION}-${GLOBE_WORLD_CURVATURE_SHADERPACK_VERSION}.zip"
            echo "- Optional Sodium/Iris MakeUp Ultra Fast curvature shader pack: makeup-ultra-fast-globe-world-optional-curvature-shaderpack-mc${MINECRAFT_VERSION}-${MAKEUP_ULTRA_FAST_GLOBE_WORLD_SHADERPACK_VERSION}.zip"
            echo
            echo "Download a shader pack only if you use Sodium/Iris and want Globe World's curvature effect. The Fabric mod works without them."
          } > release-notes.md

          gh release create "v${MOD_VERSION}" \
            "${release_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Globe World v${MOD_VERSION}" \
            --notes-file release-notes.md \
            --prerelease
